<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>スマホ対応 数独アプリ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>数独アプリ</h1>
        <p>スマホでも遊びやすいシンプルな数独です</p>
      </header>

      <p id="message" class="message" aria-live="polite"></p>

      <section class="controls" aria-label="ゲーム操作">
        <label>
          難易度
          <select id="difficulty">
            <option value="easy">かんたん</option>
            <option value="normal" selected>ふつう</option>
            <option value="hard">むずかしい</option>
          </select>
        </label>
        <button id="new-game">新しいゲーム</button>
        <button id="check">答え合わせ</button>
        <button id="solve">自動で解く</button>
      </section>

      <section class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="数独ボード"></div>
      </section>

      <section class="number-pad" aria-label="数字入力">
        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button data-number="0" class="clear">消す</button>
      </section>

    </main>

    <script src="app.js"></script>
  </body>
</html>
